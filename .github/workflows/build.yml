name: Compile Nuitka Binaries

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    # Step 1: Pull your code onto the cloud runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # Matching the version you used locally

    # Step 3: Install Nuitka and your project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka paramiko

    # Step 4: Compile the standalone executable
    - name: Build with Nuitka
      run: python -m nuitka --assume-yes-for-downloads --enable-plugin=tk-inter --onefile BrennanSSH.py

    # Step 5: Upload the finished binaries so you can download them
    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: BrennanSSH-${{ matrix.os }}
        path: |
          *.exe
          *.bin
          BrennanSSH