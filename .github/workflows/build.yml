name: Compile Nuitka Binaries

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Tells GitHub to run when you push a version tag (like v1.0)

env:
  VSCMD_SKIP_SENDTELEMETRY: "1"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Linux Prerequisites
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka paramiko

    - name: Build with Nuitka
      run: python -m nuitka --assume-yes-for-downloads --enable-plugin=tk-inter --windows-console-mode=disable --onefile BrennanSSH.py

    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: BrennanSSH-${{ matrix.os }}
        path: |
          *.exe
          *.bin
          BrennanSSH

  # NEW: This job creates the public release page
  release:
    name: Create GitHub Release
    needs: build # Waits for all 4 OS builds to finish first
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # ONLY runs if you pushed a tag
    permissions:
      contents: write # Gives the cloud runner permission to create the release
    
    steps:
    - name: Download all compiled artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Package files into OS-specific zips
      run: |
        cd artifacts
        for folder in */; do
          zip -r "${folder%/}.zip" "$folder"
        done
        
    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*.zip
        generate_release_notes: true