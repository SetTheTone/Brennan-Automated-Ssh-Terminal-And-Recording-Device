name: Compile Nuitka Binaries

on:
  push:
    branches: [ "main" ]

env:
  VSCMD_SKIP_SENDTELEMETRY: "1"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    
    runs-on: ${{ matrix.os }}

    steps:
    # Step 1: Pull your code onto the cloud runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Step 3: Install Linux Prerequisites (Runs ONLY on Ubuntu)
    - name: Install Linux Prerequisites
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf

    # Step 4: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka paramiko

    # Step 5: Compile the standalone executable
    - name: Build with Nuitka
      run: python -m nuitka --assume-yes-for-downloads --enable-plugin=tk-inter --onefile BrennanSSH.py

    # Step 6: Upload the finished binaries so you can download them
    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: BrennanSSH-${{ matrix.os }}
        path: |
          *.exe
          *.bin
          BrennanSSH
